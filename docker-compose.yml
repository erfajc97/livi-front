services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SECRET_KEY: ${VITE_SECRET_KEY}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
